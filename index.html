<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GYRO DODGE（ジャイロドッジ）</title>
  <style>
    :root {
      --ad-height: 60px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Yu Gothic", sans-serif;
      background: #0b2545;
      color: #ffffff;
    }

    /* 背景（浮遊島・空・リング風のレイヤー） */
    .sky-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 75% 22%, rgba(255, 255, 255, 0.45), transparent 35%),
        radial-gradient(circle at 20% 70%, rgba(125, 211, 252, 0.35), transparent 45%),
        linear-gradient(180deg, #1d8fe1 0%, #67c3f8 48%, #bce6ff 78%, #e0f4ff 100%);
      overflow: hidden;
    }

    .floating-island {
      position: absolute;
      border-radius: 28% 28% 55% 55% / 22% 22% 75% 75%;
      background: linear-gradient(180deg, #38b000 0%, #2b9348 26%, #7f5539 28%, #4a2c18 100%);
      box-shadow: 0 18px 32px rgba(15, 23, 42, 0.28);
      opacity: 0.92;
    }

    .island-left {
      width: 150px;
      height: 130px;
      left: -24px;
      top: 31%;
      transform: rotate(-6deg);
    }

    .island-right {
      width: 210px;
      height: 175px;
      right: -30px;
      top: 24%;
      transform: rotate(5deg);
    }

    .energy-ring {
      position: absolute;
      border-radius: 50%;
      border: 6px solid rgba(255, 214, 10, 0.88);
      box-shadow: 0 0 18px rgba(255, 195, 0, 0.75), inset 0 0 12px rgba(255, 255, 255, 0.7);
      pointer-events: none;
    }

    .ring-1 { width: 74px; height: 74px; left: 26%; top: 30%; transform: rotate(24deg); }
    .ring-2 { width: 92px; height: 92px; right: 14%; top: 36%; transform: rotate(-18deg); }

    /* アプリ全体のレイアウト */
    .app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: calc(10px + var(--safe-top));
      /* メニュー表示時は広告高さ＋セーフエリア分の余白を確保して被りを防止 */
      padding-bottom: calc(var(--ad-height) + var(--safe-bottom) + 10px);
      transition: padding-bottom 0.2s ease;
    }

    /* プレイ中は広告を完全非表示にするため下部余白を最小化 */
    body.is-playing .app-shell {
      padding-bottom: calc(12px + var(--safe-bottom));
    }

    /* 上部ステータスバー */
    .top-hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 14px;
      z-index: 10;
    }

    .hud-left, .hud-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .level-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(180deg, rgba(15, 52, 96, 0.88), rgba(9, 30, 58, 0.92));
      border: 2px solid rgba(147, 197, 253, 0.7);
      border-radius: 999px;
      padding: 4px 12px 4px 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .level-bar-wrap {
      display: flex;
      flex-direction: column;
      min-width: 66px;
    }

    .level-text {
      font-size: 13px;
      font-weight: 900;
      line-height: 1.1;
    }

    .level-gauge {
      width: 100%;
      height: 5px;
      margin-top: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }

    .level-gauge > span {
      display: block;
      width: 68%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #facc15);
    }

    .currency-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(180deg, rgba(15, 52, 96, 0.88), rgba(9, 30, 58, 0.92));
      border: 2px solid rgba(147, 197, 253, 0.65);
      border-radius: 999px;
      padding: 4px 6px 4px 10px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .plus-btn {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      color: #fff;
      font-weight: 900;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
    }

    .icon-circle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid rgba(191, 219, 254, 0.8);
      background: linear-gradient(180deg, #2563eb, #1d4ed8);
      color: #fff;
      font-size: 17px;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .landscape-only-btn {
      display: none;
    }

    /* タイトル画面メイン領域 */
    .title-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px 6px;
      min-height: 0;
    }

    .logo-block {
      text-align: center;
      margin-top: 2px;
    }

    .logo-main {
      font-size: clamp(34px, 7.5vw, 56px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1px;
      line-height: 0.96;
      background: linear-gradient(180deg, #ffffff 0%, #fde047 48%, #f97316 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 0 #0f172a) drop-shadow(0 8px 14px rgba(15, 23, 42, 0.45));
    }

    .logo-sub {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 14px;
      border-radius: 999px;
      background: linear-gradient(90deg, #0369a1, #1d4ed8, #0369a1);
      border: 2px solid #93c5fd;
      font-size: clamp(12px, 2.4vw, 15px);
      font-weight: 800;
      letter-spacing: 2px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    /* 機体ビジュアル */
    .craft-showcase {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 0;
    }

    .craft-body {
      width: clamp(150px, 34vw, 220px);
      height: clamp(76px, 16vw, 110px);
      border-radius: 40% 60% 45% 55% / 55% 45% 55% 45%;
      background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 45%, #3b82f6 78%, #f97316 100%);
      border: 3px solid #ffffff;
      box-shadow: 0 14px 26px rgba(15, 23, 42, 0.35), 0 0 24px rgba(56, 189, 248, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: hoverCraft 2.6s ease-in-out infinite;
    }

    .craft-cockpit {
      width: 44%;
      height: 42%;
      border-radius: 999px;
      background: linear-gradient(180deg, #bae6fd, #0284c7);
      border: 2px solid #e0f2fe;
    }

    .craft-thruster {
      position: absolute;
      left: -26px;
      width: 34px;
      height: 16px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #38bdf8, #ffffff);
      filter: blur(1px);
    }

    @keyframes hoverCraft {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    /* アクションボタン群 */
    .menu-controls {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .start-btn {
      width: 100%;
      max-width: 440px;
      align-self: center;
      padding: 13px 24px;
      border-radius: 20px;
      border: 3px solid #fef08a;
      background: linear-gradient(180deg, #fbbf24 0%, #f97316 58%, #ea580c 100%);
      color: #ffffff;
      font-size: clamp(22px, 4.5vw, 28px);
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 3px 0 rgba(124, 45, 18, 0.85);
      box-shadow: 0 7px 0 #9a3412, 0 14px 24px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      transition: transform 0.08s ease;
    }

    .start-btn:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 #9a3412, 0 6px 12px rgba(0, 0, 0, 0.3);
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }

    .mode-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.72);
      color: #ffffff;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(15, 23, 42, 0.35), 0 8px 14px rgba(0, 0, 0, 0.22);
      transition: transform 0.08s ease;
    }

    .mode-btn:active {
      transform: translateY(3px);
    }

    .mode-btn-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .mode-icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    .mode-title {
      font-size: 14px;
      font-weight: 900;
      line-height: 1.15;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
    }

    .mode-sub {
      font-size: 11px;
      font-weight: 700;
      opacity: 0.95;
      line-height: 1.2;
      margin-top: 2px;
    }

    .mode-adventure { background: linear-gradient(180deg, #38bdf8, #2563eb); }
    .mode-online    { background: linear-gradient(180deg, #c084fc, #7e22ce); }
    .mode-customize { background: linear-gradient(180deg, #4ade80, #15803d); }
    .mode-collection{ background: linear-gradient(180deg, #facc15, #d97706); }

    .zukan-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      border-radius: 14px;
      border: 2px solid rgba(186, 230, 253, 0.75);
      background: linear-gradient(180deg, rgba(14, 116, 144, 0.9), rgba(15, 23, 42, 0.92));
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.28);
    }

    .zukan-bar-main {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
    }

    /* 横画面レイアウト（デザイン例2枚目のように横並び・コンパクト化） */
    @media (orientation: landscape) and (max-height: 560px) {
      .landscape-only-btn {
        display: grid;
      }

      .title-screen {
        justify-content: center;
        gap: 10px;
      }

      .title-center-row {
        width: 100%;
        max-width: 920px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .logo-block {
        text-align: left;
      }

      .start-btn {
        max-width: 300px;
        width: auto;
        padding: 12px 28px;
      }

      .mode-grid {
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }

      .mode-btn {
        flex-direction: column;
        justify-content: center;
        text-align: center;
        padding: 8px 6px;
      }

      .mode-btn-left {
        flex-direction: column;
        gap: 4px;
      }

      .mode-arrow, .zukan-bar {
        display: none;
      }
    }

    /* プレイ中画面（操作・ボタンを最優先し広告は完全非表示） */
    .play-screen {
      display: none;
      flex: 1;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 16px;
      z-index: 5;
    }

    body.is-playing .title-screen {
      display: none;
    }

    body.is-playing .play-screen {
      display: flex;
    }

    .play-status-banner {
      align-self: center;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 700;
    }

    .play-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .steer-btn {
      flex: 1;
      max-width: 180px;
      height: 68px;
      border-radius: 18px;
      border: 2px solid rgba(255, 255, 255, 0.75);
      background: rgba(15, 23, 42, 0.65);
      color: #ffffff;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
    }

    .quit-play-btn {
      padding: 12px 18px;
      border-radius: 16px;
      border: 2px solid #fca5a5;
      background: rgba(185, 28, 28, 0.88);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    /* 下部バナー広告枠：メニュー時のみ表示、プレイ中は完全非表示 */
    .bottom-ad-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(var(--ad-height) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: rgba(248, 250, 252, 0.96);
      border-top: 1px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    body.is-playing .bottom-ad-bar {
      display: none !important;
    }

    .ad-placeholder-box {
      width: 100%;
      max-width: 468px;
      height: var(--ad-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      color: #1e293b;
      font-size: 12px;
      font-weight: 700;
    }

    .ad-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #e2e8f0;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="sky-backdrop" aria-hidden="true">
    <div class="floating-island island-left"></div>
    <div class="floating-island island-right"></div>
    <div class="energy-ring ring-1"></div>
    <div class="energy-ring ring-2"></div>
  </div>

  <div class="app-shell">
    <!-- 上部HUD -->
    <header class="top-hud">
      <div class="hud-left">
        <div class="level-pill">
          <span>👑</span>
          <div class="level-bar-wrap">
            <span class="level-text">Lv.12</span>
            <div class="level-gauge"><span></span></div>
          </div>
        </div>
      </div>

      <div class="hud-right">
        <div class="currency-pill">
          <span>🪙</span>
          <span id="coinCount">12,840</span>
          <button class="plus-btn" type="button" aria-label="コイン追加">+</button>
        </div>
        <div class="currency-pill">
          <span>💎</span>
          <span id="gemCount">320</span>
          <button class="plus-btn" type="button" aria-label="ジェム追加">+</button>
        </div>
        <button class="icon-circle-btn landscape-only-btn" type="button" aria-label="ギフト">🎁</button>
        <button class="icon-circle-btn landscape-only-btn" type="button" aria-label="ランキング">🏆</button>
        <button class="icon-circle-btn" type="button" aria-label="設定">⚙️</button>
      </div>
    </header>

    <!-- タイトル／メニュー画面 -->
    <main class="title-screen" id="titleScreen">
      <div class="title-center-row">
        <div class="logo-block">
          <h1 class="logo-main">GYRO<br />DODGE</h1>
          <div class="logo-sub">ジャイロドッジ</div>
        </div>

        <div class="craft-showcase" aria-hidden="true">
          <div class="craft-thruster"></div>
          <div class="craft-body">
            <div class="craft-cockpit"></div>
          </div>
        </div>

        <button class="start-btn" id="startGameBtn" type="button">スタート ▶</button>
      </div>

      <div class="menu-controls">
        <div class="mode-grid">
          <button class="mode-btn mode-adventure" type="button" data-mode="冒険モード">
            <div class="mode-btn-left">
              <span class="mode-icon">📖</span>
              <div>
                <div class="mode-title">冒険モード</div>
                <div class="mode-sub">全18章</div>
              </div>
            </div>
            <span class="mode-arrow">›</span>
          </button>

          <button class="mode-btn mode-online" type="button" data-mode="オンライン">
            <div class="mode-btn-left">
              <span class="mode-icon">⚔️</span>
              <div>
                <div class="mode-title">オンライン</div>
                <div class="mode-sub">対戦・協力</div>
              </div>
            </div>
            <span class="mode-arrow">›</span>
          </button>

          <button class="mode-btn mode-customize" type="button" data-mode="カスタマイズ">
            <div class="mode-btn-left">
              <span class="mode-icon">🧥</span>
              <div>
                <div class="mode-title">カスタマイズ</div>
                <div class="mode-sub">機体を変えよう！</div>
              </div>
            </div>
            <span class="mode-arrow">›</span>
          </button>

          <button class="mode-btn mode-collection" type="button" data-mode="コレクション">
            <div class="mode-btn-left">
              <span class="mode-icon">🖼️</span>
              <div>
                <div class="mode-title">コレクション</div>
                <div class="mode-sub">全126種</div>
              </div>
            </div>
            <span class="mode-arrow">›</span>
          </button>

          <!-- 横画面時に5列目に並ぶ図鑑ボタン -->
          <button class="mode-btn mode-adventure landscape-only-btn" type="button" data-mode="図鑑">
            <div class="mode-btn-left">
              <span class="mode-icon">⭐</span>
              <div>
                <div class="mode-title">図鑑</div>
                <div class="mode-sub">仲間を集めよう！</div>
              </div>
            </div>
          </button>
        </div>

        <!-- 縦画面時に表示する図鑑バー -->
        <button class="zukan-bar" type="button" data-mode="図鑑">
          <div class="zukan-bar-main">
            <span>⭐</span>
            <span>図鑑</span>
            <span>|</span>
            <span>仲間を集めよう！</span>
          </div>
          <span>›</span>
        </button>
      </div>
    </main>

    <!-- プレイ中画面（広告は非表示・操作ボタンの干渉なし） -->
    <section class="play-screen" id="playScreen" aria-label="プレイ画面">
      <div class="play-status-banner">プレイ中（広告非表示・操作エリア保護）</div>

      <div class="play-controls">
        <button class="steer-btn" type="button">◀ 左旋回</button>
        <button class="quit-play-btn" id="quitGameBtn" type="button">メニューへ戻る</button>
        <button class="steer-btn" type="button">右旋回 ▶</button>
      </div>
    </section>
  </div>

  <!-- メニュー画面のみ表示される下部広告エリア -->
  <aside class="bottom-ad-bar" id="bottomAdBar" aria-label="広告">
    <div class="ad-placeholder-box" id="adSlot">
      <span>メニュー下部バナー広告枠（プレイ中は非表示）</span>
      <span class="ad-badge">PR</span>
    </div>
  </aside>

  <script>
    const body = document.body;
    const startGameBtn = document.getElementById("startGameBtn");
    const quitGameBtn = document.getElementById("quitGameBtn");

    function setPlayingState(playing) {
      body.classList.toggle("is-playing", playing);
      // 既存の広告スクリプトがある場合は、プレイ中に広告コンテナを非表示制御
      if (playing) {
        const adSlot = document.getElementById("adSlot");
        if (adSlot) adSlot.innerHTML = "";
      } else {
        const adSlot = document.getElementById("adSlot");
        if (adSlot && !adSlot.innerHTML) {
          adSlot.innerHTML = `
            <span>メニュー下部バナー広告枠（プレイ中は非表示）</span>
            <span class="ad-badge">PR</span>
          `;
        }
      }
    }

    startGameBtn.addEventListener("click", () => {
      setPlayingState(true);
    });

    quitGameBtn.addEventListener("click", () => {
      setPlayingState(false);
    });

    document.querySelectorAll("[data-mode]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const modeName = btn.getAttribute("data-mode");
        console.log("選択されたモード:", modeName);
      });
    });
  </script>
</body>
</html>
