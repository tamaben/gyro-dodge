<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>GYRO DODGE - ジャイロドッジ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Montserrat:ital,wght@1,900&display=swap" rel="stylesheet">
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="homeOverlay" class="home-overlay">
    <header class="top-status-bar">
      <div class="status-left">
        <div class="level-badge">
          <div class="crown-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22">
              <path d="M2 18L4 7L9 11L12 5L15 11L20 7L22 18H2Z" fill="url(#crownGrad)" stroke="#FFF3B0" stroke-width="1.5" stroke-linejoin="round"/>
              <rect x="3" y="19" width="18" height="2.5" rx="1.2" fill="#F59E0B"/>
              <defs>
                <linearGradient id="crownGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#FEF08A"/>
                  <stop offset="100%" stop-color="#F59E0B"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div class="level-info">
            <span class="level-label">Lv.<span id="playerLevel">12</span></span>
            <div class="exp-track">
              <div class="exp-fill" id="expFill" style="width: 68%;"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="status-right">
        <div class="resource-pill">
          <span class="coin-disc">$</span>
          <span class="resource-val" id="coinVal">12,840</span>
          <button class="plus-circle" type="button" id="addCoinBtn" aria-label="コイン獲得">+</button>
        </div>

        <div class="resource-pill">
          <span class="gem-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="19" height="19">
              <polygon points="6,3 18,3 22,9 12,21 2,9" fill="url(#gemGrad)" stroke="#E0F2FE" stroke-width="1.4"/>
              <polyline points="2,9 22,9" stroke="#BAE6FD" stroke-width="1.2" fill="none"/>
              <polyline points="6,3 9,9 12,21 15,9 18,3" stroke="#BAE6FD" stroke-width="1.1" fill="none"/>
              <defs>
                <linearGradient id="gemGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#E0F2FE"/>
                  <stop offset="45%" stop-color="#38BDF8"/>
                  <stop offset="100%" stop-color="#2563EB"/>
                </linearGradient>
              </defs>
            </svg>
          </span>
          <span class="resource-val" id="gemVal">320</span>
          <button class="plus-circle" type="button" id="addGemBtn" aria-label="ジェム獲得">+</button>
        </div>

        <button class="circle-icon-btn landscape-only" type="button" id="giftBtn" title="プレゼント">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="8" width="18" height="4" rx="1"/>
            <path d="M12 8v13"/>
            <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>
            <path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>
          </svg>
        </button>

        <button class="circle-icon-btn landscape-only" type="button" id="trophyBtn" title="記録">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
            <path d="M4 22h16"/>
            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
          </svg>
        </button>

        <button class="circle-icon-btn" type="button" id="settingsBtn" title="設定・収録ボイス">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="#FFFFFF">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="hero-stage">
      <div class="title-logo-wrap">
        <svg class="logo-orbit-svg" viewBox="0 0 520 235" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFF59D"/>
              <stop offset="50%" stop-color="#FBBF24"/>
              <stop offset="100%" stop-color="#EA580C"/>
            </linearGradient>
            <linearGradient id="ringBlue" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#38BDF8"/>
              <stop offset="50%" stop-color="#0284C7"/>
              <stop offset="100%" stop-color="#93C5FD"/>
            </linearGradient>
            <linearGradient id="gyroTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#FFFFFF"/>
              <stop offset="62%" stop-color="#F1F5F9"/>
              <stop offset="100%" stop-color="#BAE6FD"/>
            </linearGradient>
            <linearGradient id="dodgeTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#FEF08A"/>
              <stop offset="48%" stop-color="#FBBF24"/>
              <stop offset="100%" stop-color="#EA580C"/>
            </linearGradient>
            <filter id="logoShadow" x="-15%" y="-15%" width="130%" height="135%">
              <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0A2540" flood-opacity="0.72"/>
            </filter>
          </defs>

          <ellipse cx="260" cy="112" rx="228" ry="62" transform="rotate(-14 260 112)" fill="none" stroke="url(#ringBlue)" stroke-width="11" opacity="0.9"/>
          <ellipse cx="260" cy="112" rx="192" ry="82" transform="rotate(-24 260 112)" fill="none" stroke="url(#ringGold)" stroke-width="14"/>

          <g filter="url(#logoShadow)" transform="skewX(-10)">
            <text x="275" y="96" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="78" fill="#0B2948" stroke="#0B2948" stroke-width="14" stroke-linejoin="round">GYRO</text>
            <text x="275" y="96" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="78" fill="url(#gyroTextGrad)" stroke="#1E3A8A" stroke-width="3">GYRO</text>

            <text x="295" y="162" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="76" fill="#0B2948" stroke="#0B2948" stroke-width="14" stroke-linejoin="round">DODGE</text>
            <text x="295" y="162" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="76" fill="url(#dodgeTextGrad)" stroke="#7C2D12" stroke-width="3">DODGE</text>
          </g>

          <path d="M 48 148 C 110 198, 325 182, 466 86" fill="none" stroke="url(#ringGold)" stroke-width="12" stroke-linecap="round"/>

          <g filter="url(#logoShadow)" transform="rotate(-6 275 194)">
            <polygon points="155,176 395,176 382,210 142,210" fill="#0C2D57" stroke="#38BDF8" stroke-width="2.5"/>
            <text x="268" y="200" text-anchor="middle" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="21" fill="#FFFFFF" letter-spacing="2">ジャイロドッジ</text>
          </g>
        </svg>
      </div>

      <div class="craft-spacer" aria-hidden="true"></div>

      <div class="start-section">
        <div class="env-switch-bar" role="group" aria-label="3Dステージ環境選択">
          <button type="button" class="env-pill active" id="envOutdoorBtn" data-env="outdoor">
            <span class="env-dot outdoor-dot"></span>
            <span>外ステージ（天空エリア）</span>
          </button>
          <button type="button" class="env-pill" id="envIndoorBtn" data-env="indoor">
            <span class="env-dot indoor-dot"></span>
            <span>室内ステージ（全12回廊）</span>
          </button>
        </div>

        <div class="start-cta-wrap">
          <div class="start-orbit-ring" aria-hidden="true"></div>
          <button class="start-cta-btn" id="startBtn" type="button">
            <span class="start-cta-label">スタート</span>
            <span class="start-play-triangle" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </div>

    <nav class="bottom-menu-dock" aria-label="ゲームメニュー">
      <div class="menu-grid">
        <button class="glossy-btn btn-blue" type="button" data-panel="adventure">
          <div class="glossy-inner">
            <svg class="menu-svg-icon" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
            <div class="menu-text-col">
              <span class="menu-title">冒険モード</span>
              <span class="menu-sub">全12章（外・室内）</span>
            </div>
          </div>
          <span class="chevron-icon">›</span>
        </button>

        <button class="glossy-btn btn-purple" type="button" data-panel="online">
          <div class="glossy-inner">
            <svg class="menu-svg-icon" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/>
              <line x1="13" y1="19" x2="19" y2="13"/>
              <line x1="16" y1="16" x2="20" y2="20"/>
              <polyline points="9.5 17.5 21 6 21 3 18 3 6.5 14.5"/>
              <line x1="11" y1="19" x2="5" y2="13"/>
              <line x1="8" y1="16" x2="4" y2="20"/>
            </svg>
            <div class="menu-text-col">
              <span class="menu-title">オンライン</span>
              <span class="menu-sub">対戦・協力</span>
            </div>
          </div>
          <span class="chevron-icon">›</span>
        </button>

        <button class="glossy-btn btn-green" type="button" data-panel="customize">
          <div class="glossy-inner">
            <svg class="menu-svg-icon" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 6a2 2 0 1 0-2-2"/>
              <path d="M12 6v2l8 5.5a1.5 1.5 0 0 1-.85 2.75H4.85A1.5 1.5 0 0 1 4 13.5L12 8z"/>
            </svg>
            <div class="menu-text-col">
              <span class="menu-title">カスタマイズ</span>
              <span class="menu-sub">機体を変えよう！</span>
            </div>
          </div>
          <span class="chevron-icon">›</span>
        </button>

        <button class="glossy-btn btn-gold" type="button" data-panel="collection">
          <div class="glossy-inner">
            <svg class="menu-svg-icon" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="14" height="12" rx="2"/>
              <path d="M7 19h12a2 2 0 0 0 2-2V8"/>
              <circle cx="8" cy="10" r="1.2" fill="#FFFFFF"/>
              <polyline points="4 15 8 11 12 14 14 12 17 15"/>
            </svg>
            <div class="menu-text-col">
              <span class="menu-title">コレクション</span>
              <span class="menu-sub">全126種</span>
            </div>
          </div>
          <span class="chevron-icon">›</span>
        </button>

        <button class="glossy-btn btn-cyan landscape-only-flex" type="button" data-panel="zukan">
          <div class="glossy-inner">
            <svg class="menu-svg-icon" viewBox="0 0 24 24" fill="#BAE6FD" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
            <div class="menu-text-col">
              <span class="menu-title">図鑑</span>
              <span class="menu-sub">仲間を集めよう！</span>
            </div>
          </div>
        </button>
      </div>

      <button class="zukan-wide-bar portrait-only-flex" type="button" data-panel="zukan">
        <div class="zukan-wide-left">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="#7DD3FC" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
          <span class="zukan-wide-title">図鑑</span>
          <span class="zukan-wide-divider"></span>
          <span class="zukan-wide-sub">仲間を集めよう！</span>
        </div>
        <span class="chevron-icon">›</span>
      </button>
    </nav>
  </div>

  <div id="playHud" class="play-hud hidden">
    <div class="play-top-bar">
      <div class="play-stat-chip">SCORE <strong id="scoreDisplay">0</strong></div>
      <div class="play-stat-chip">RING <strong id="ringDisplay">0</strong></div>
      <div class="play-stat-chip" id="stageChip">外ステージ CH.1</div>
      <button class="pause-btn" id="pauseBtn" type="button">ホームへ戻る</button>
    </div>

    <div id="countdownBanner" class="countdown-banner hidden">3</div>

    <div class="touch-control-zones">
      <button class="touch-pad left-pad" id="leftSteerBtn" type="button" aria-label="左へ移動">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="#FFFFFF"><polygon points="16,4 6,12 16,20"/></svg>
      </button>
      <button class="touch-pad right-pad" id="rightSteerBtn" type="button" aria-label="右へ移動">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="#FFFFFF"><polygon points="8,4 18,12 8,20"/></svg>
      </button>
    </div>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">メニュー</h2>
        <button class="modal-close" id="modalCloseBtn" type="button" aria-label="閉じる">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
            <line x1="6" y1="6" x2="18" y2="18"/>
            <line x1="18" y1="6" x2="6" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./game.js"></script>
</body>
</html>
