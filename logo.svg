<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1526"/>
      <stop offset="55%" stop-color="#13294b"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="metalLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="metalRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="canopyGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <radialGradient id="burnerGlow" cx="50%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgSky)"/>
  <rect x="12" y="12" width="488" height="488" rx="102" fill="none" stroke="#38bdf8" stroke-opacity="0.32" stroke-width="4"/>

  <!-- Precision Gyro Gimbal Rings -->
  <ellipse cx="256" cy="264" rx="194" ry="86" transform="rotate(-24 256 264)" fill="none" stroke="url(#amberAccent)" stroke-width="10" opacity="0.88"/>
  <ellipse cx="256" cy="264" rx="164" ry="164" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-dasharray="38 18" opacity="0.4"/>

  <!-- Supersonic Interceptor Silhouette -->
  <g transform="translate(256, 252) rotate(-16)">
    <!-- Twin Afterburner Plumes -->
    <polygon points="-42,96 -14,96 -28,176" fill="url(#burnerGlow)"/>
    <polygon points="14,96 42,96 28,176" fill="url(#burnerGlow)"/>

    <!-- Main Swept Wings -->
    <polygon points="-18,-42 -156,68 -148,90 -24,68" fill="url(#metalLeft)"/>
    <polygon points="18,-42 156,68 148,90 24,68" fill="url(#metalRight)"/>

    <!-- Wingtip Accent Stripes -->
    <polygon points="-136,52 -156,68 -148,90 -128,78" fill="url(#amberAccent)"/>
    <polygon points="136,52 156,68 148,90 128,78" fill="url(#amberAccent)"/>

    <!-- Forward Canards -->
    <polygon points="-14,-82 -68,-44 -62,-32 -16,-48" fill="url(#metalLeft)"/>
    <polygon points="14,-82 68,-44 62,-32 16,-48" fill="url(#metalRight)"/>

    <!-- Twin Tail Fins -->
    <polygon points="-34,36 -66,102 -42,102 -20,56" fill="#475569"/>
    <polygon points="34,36 66,102 42,102 20,56" fill="#1e293b"/>

    <!-- Sculpted Fuselage -->
    <polygon points="0,-168 -36,-24 -38,96 0,84" fill="url(#metalLeft)"/>
    <polygon points="0,-168 36,-24 38,96 0,84" fill="url(#metalRight)"/>

    <!-- Bubble Glass Canopy -->
    <ellipse cx="0" cy="-58" rx="15" ry="44" fill="url(#canopyGlass)" stroke="#bae6fd" stroke-width="2"/>
    <ellipse cx="-4" cy="-68" rx="4" ry="18" fill="#ffffff" opacity="0.55"/>

    <!-- Twin Exhaust Nozzles -->
    <rect x="-38" y="88" width="22" height="14" rx="4" fill="#0f172a"/>
    <rect x="16" y="88" width="22" height="14" rx="4" fill="#0f172a"/>
  </g>
</svg>