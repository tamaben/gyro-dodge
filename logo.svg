<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
    <linearGradient id="wingRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="wingLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>
  <!-- Rounded Square Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#FED7AA" stroke-width="8"/>

  <!-- 3D Tunnel Rings -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#FDBA74" stroke-width="14" stroke-dasharray="64 28" opacity="0.55"/>
  <circle cx="256" cy="256" r="146" fill="none" stroke="#1E293B" stroke-width="14" opacity="0.14"/>
  <circle cx="256" cy="256" r="96" fill="none" stroke="#F97316" stroke-width="10" opacity="0.28"/>

  <!-- Speed Motion Lines -->
  <line x1="94" y1="362" x2="162" y2="294" stroke="#F97316" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <line x1="418" y1="362" x2="350" y2="294" stroke="#F97316" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <line x1="256" y1="428" x2="256" y2="368" stroke="#1E293B" stroke-width="10" stroke-linecap="round" opacity="0.25"/>

  <!-- Low-Poly 3D Glider Ship -->
  <g transform="translate(256, 248) rotate(-14)">
    <!-- Shadow -->
    <polygon points="0,-118 118,92 0,54 -118,92" fill="#1E293B" opacity="0.14" transform="translate(0, 18)"/>
    <!-- Left Wing -->
    <polygon points="0,-118 -118,92 0,48" fill="url(#wingLeft)"/>
    <!-- Right Wing -->
    <polygon points="0,-118 118,92 0,48" fill="url(#wingRight)"/>
    <!-- Center Fuselage Ridge -->
    <polygon points="0,-118 32,56 0,42 -32,56" fill="#FFF7ED" opacity="0.92"/>
    <!-- Thruster Core -->
    <polygon points="-26,56 26,56 0,88" fill="#1E293B"/>
    <polygon points="-14,58 14,58 0,78" fill="#FDBA74"/>
  </g>
</svg>